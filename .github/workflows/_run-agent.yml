# Reusable / manually-triggered agent dispatcher.
#
# Secrets expected (this repo or org):
#   ANTHROPIC_API_KEY, OPENCODE_API_KEY, OPENROUTER_API_KEY

name: Run Agent

on:
  workflow_call:
    inputs:
      provider:
        description: "Agent provider: claude | opencode"
        required: true
        type: string
      prompt:
        description: "Prompt to send"
        required: true
        type: string
      model:
        description: "Model override (blank = provider default)"
        required: false
        type: string
        default: ""
      fallback_model:
        description: "OpenCode fallback model, tried only if the primary opencode run fails (blank = no fallback)"
        required: false
        type: string
        default: ""
      concurrency_group:
        description: "Concurrency group suffix; runs sharing a suffix cancel each other"
        required: false
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

  # checkov:skip=CKV_GHA_7: Manual inputs required
  workflow_dispatch:
    inputs:
      provider:
        description: "Agent provider"
        required: true
        type: choice
        options: [claude, opencode]
        default: claude
      prompt:
        description: "Prompt to send"
        required: true
        type: string
      model:
        description: "Model override (leave blank for provider default)"
        required: false
        type: string
        default: ""
      fallback_model:
        description: "OpenCode fallback model, tried only if the primary opencode run fails (blank = no fallback)"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

# A superseded agent run is wasted runner time and a wasted PR: cancel it as
# soon as a newer run for the same target starts.
concurrency:
  group: run-agent-${{ inputs.concurrency_group != '' && inputs.concurrency_group || github.ref }}
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # Package update tasks may need extra time for non-interactive checksum and
    # metadata refreshes on heavyweight packages such as LLVM or Chromium.
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GIT_AUTHOR_NAME: Ven0m0
      GIT_AUTHOR_EMAIL: Ven0m0@users.noreply.github.com
      GIT_COMMITTER_NAME: Ven0m0
      GIT_COMMITTER_EMAIL: Ven0m0@users.noreply.github.com
      CI: "true"
      GH_PROMPT_DISABLED: "1"
      GIT_TERMINAL_PROMPT: "0"
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
      PYTHONOPTIMIZE: "1"
      PAGER: cat
      GIT_PAGER: cat
      GIT_MERGE_AUTOEDIT: no
      NODE_NO_WARNINGS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_LINK_MODE: symlink

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth 2 keeps HEAD~1 available for diffing. Do not add a
          # blob:none filter on top: at this depth it saves nothing and turns
          # the clone into a partial one, so later reads lazily refetch blobs.
          fetch-depth: 2
          show-progress: false
      - name: Configure git identity
        shell: bash
        run: |
          git config --local user.email "${GIT_AUTHOR_EMAIL}"
          git config --local user.name "${GIT_AUTHOR_NAME}"

      # The agent almost always needs the Arch build toolchain. Start the pull
      # detached so it overlaps with the agent's first (model-bound) turns
      # instead of stalling the run mid-task; docker de-duplicates a concurrent
      # pull of the same image, so a later `docker run` just joins this one.
      # Best-effort only: a failed prefetch must not fail the job.
      - name: Prefetch Arch build image
        shell: bash
        run: |
          set -euo pipefail
          nohup docker pull --quiet archlinux:base-devel >/dev/null 2>&1 &

      - name: Run Claude
        if: inputs.provider == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ inputs.prompt }}
          claude_args: ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
        env:
          CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
          CLAUDE_CODE_ENABLE_TELEMETRY: "0"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
          ENABLE_TOOL_SEARCH: "1"
          ENABLE_LSP_TOOL: "1"
          USE_BUILTIN_RIPGREP: "1"
          CLAUDE_CODE_ENABLE_TASKS: "true"

      - name: Run OpenCode
        id: opencode
        if: inputs.provider == 'opencode'
        # Must be a literal: expressions here are re-evaluated inside the
        # composite action, where workflow inputs are empty, so
        # `inputs.fallback_model != ''` silently becomes false
        # (actions/runner#2418). The gate step below restores job failure
        # when neither attempt succeeds.
        continue-on-error: true
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_EXPERIMENTAL: "true"
          OPENCODE_ENABLE_EXA: "1"
          OPENCODE_EXPERIMENTAL_LSP_TOOL: "true"
          OPENCODE_EXPERIMENTAL_MARKDOWN: "true"
          OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
          OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: "300000"
          OPENCODE_EXPERIMENTAL_LAZY_TOOLS: "true"
          OPENCODE_PRUNE_SCALE_WITH_CONTEXT: "true"
          OPENCODE_DISABLE_FILETIME_CHECK: "true"
          OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: "1"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_EXPERIMENTAL_OXFMT: "true"
          MORPH_TIMEOUT: "60000"
          MORPH_MODEL: morph-v3-fast
        with:
          model: ${{ inputs.model != '' && inputs.model || 'opencode/nemotron-3-ultra-free' }}
          prompt: ${{ inputs.prompt }}
          use_github_token: false

      - name: Run OpenCode (fallback model)
        id: opencode-fallback
        if: inputs.provider == 'opencode' && inputs.fallback_model != '' && steps.opencode.outcome == 'failure'
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_EXPERIMENTAL: "true"
          OPENCODE_ENABLE_EXA: "1"
          OPENCODE_EXPERIMENTAL_LSP_TOOL: "true"
          OPENCODE_EXPERIMENTAL_MARKDOWN: "true"
          OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
          OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: "300000"
          OPENCODE_EXPERIMENTAL_LAZY_TOOLS: "true"
          OPENCODE_PRUNE_SCALE_WITH_CONTEXT: "true"
          OPENCODE_DISABLE_FILETIME_CHECK: "true"
          OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: "1"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_EXPERIMENTAL_OXFMT: "true"
          MORPH_TIMEOUT: "60000"
          MORPH_MODEL: morph-v3-fast
        with:
          model: ${{ inputs.fallback_model }}
          prompt: ${{ inputs.prompt }}
          use_github_token: false

      # Restores the failure swallowed by continue-on-error on the primary
      # OpenCode step when no fallback ran or the fallback was skipped.
      - name: Fail if no OpenCode attempt succeeded
        if: inputs.provider == 'opencode' && steps.opencode.outcome != 'success' && steps.opencode-fallback.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::OpenCode failed (primary: ${{ steps.opencode.outcome }}, fallback: ${{ steps.opencode-fallback.outcome }})"
          exit 1
