name: _update-pkgbuilds
on:
  # checkov:skip=CKV_GHA_7: Manual inputs required
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated version-controlled package dirs to update (blank = all tracked packages)"
        required: false
        type: string
        default: ""
      force:
        description: "Run the agent even when nvchecker reports no drift"
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: update-pkgbuilds
  cancel-in-progress: true

jobs:
  # Version detection is deterministic, so run it here instead of paying for the
  # agent to install nvchecker, run it, and diff the results in model turns. Most
  # dispatches find nothing to do and stop at this job in well under a minute.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_drift: ${{ steps.diff.outputs.has_drift }}
      drift: ${{ steps.diff.outputs.drift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install nvchecker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet nvchecker

      - name: Run nvchecker
        id: nvchecker
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # nvchecker's GitHub source is rate-limited hard without a token.
          keyfile="$(mktemp)"
          trap 'rm -f "${keyfile}"' EXIT
          printf '[keys]\ngithub = "%s"\n' "${GH_API_TOKEN}" > "${keyfile}"
          # nvchecker takes no positional entry names and its -e flag accepts a
          # single entry, so check everything and narrow the result in the diff
          # step instead. A single unreachable upstream must not blank out the
          # run, so tolerate a non-zero exit and judge by new_ver.json.
          nvchecker -c nvchecker.toml -k "${keyfile}" -t 3 || true
          if [[ -s .github/nvchecker/new_ver.json ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::nvchecker produced no results; handing the full check to the agent"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff against tracked versions
        id: diff
        shell: bash
        env:
          NVCHECKER_OK: ${{ steps.nvchecker.outputs.ok }}
          FORCE: ${{ inputs.force }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if [[ "${NVCHECKER_OK}" != "true" ]]; then
            # Detection failed: fall back to the agent doing its own check.
            {
              echo "has_drift=true"
              echo "drift="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          def load(path):
              """Read either nvchecker format as a flat {name: version} map.

              nvchecker writes the v2 shape ({"version": 2, "data": {name:
              {"version": ...}}}) but still reads the legacy flat map, which is
              what old_ver.json in this repo is.
              """
              data = json.loads(Path(path).read_text())
              if isinstance(data, dict) and data.get("version") == 2:
                  return {k: v["version"] for k, v in data.get("data", {}).items()}
              return data

          old = load(".github/nvchecker/old_ver.json")
          new = load(".github/nvchecker/new_ver.json")
          # nvchecker always checks every entry; honour the dispatch filter here.
          wanted = set(os.environ.get("PACKAGES", "").split())
          drift = sorted(
              (name, old.get(name, "<untracked>"), version)
              for name, version in new.items()
              if old.get(name) != version and (not wanted or name in wanted)
          )
          forced = os.environ.get("FORCE") == "true"
          print(f"has_drift={'true' if drift or forced else 'false'}")
          print("drift<<NVDRIFT")
          for name, before, after in drift:
              print(f"- {name}: {before} -> {after}")
          print("NVDRIFT")
          PY

      - name: Summarise
        shell: bash
        env:
          HAS_DRIFT: ${{ steps.diff.outputs.has_drift }}
          DRIFT: ${{ steps.diff.outputs.drift }}
        run: |
          set -euo pipefail
          if [[ "${HAS_DRIFT}" == "true" ]]; then
            printf '## Packages behind upstream\n\n%s\n' "${DRIFT:-(detection failed; agent will re-check)}"
          else
            printf '## All tracked packages are current\n\nNo agent run needed.\n'
          fi >> "$GITHUB_STEP_SUMMARY"

  update-pkgbuilds:
    needs: detect
    if: needs.detect.outputs.has_drift == 'true'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/_run-agent.yml
    with:
      provider: opencode
      model: "opencode/nemotron-3.5-lightning-free"
      fallback_model: "opencode/big-pickle"
      concurrency_group: update-pkgbuilds
      prompt: |
        Update the PKGBUILDs listed below to their latest upstream versions and open ONE pull request.

        ${{ needs.detect.outputs.drift != '' && 'nvchecker has already run. These packages are behind upstream, given as `nvchecker key: tracked -> latest`:' || 'Version detection did not run this time. Install and run nvchecker against `nvchecker.toml` yourself, diff the result against `.github/nvchecker/old_ver.json`, and update every package that is behind.' }}

        ${{ needs.detect.outputs.drift }}

        ${{ needs.detect.outputs.drift != '' && 'Work only on those packages. Do not re-run nvchecker and do not touch any other package.' || '' }}
        ${{ inputs.packages != '' && format('Restrict the run further to these package directories: {0}', inputs.packages) || '' }}

        `.opencode/skills/update-pkgbuild/SKILL.md` and `.opencode/rules/pkgbuild.md` are the canonical procedure. Read them first. The rules below win on any conflict.

        SETUP
        1. Everything runs non-interactively. Pass explicit flags to git, nvchecker, makepkg and updpkgsums; never block on a prompt.
        2. You need makepkg and updpkgsums (pacman-contrib). If the runner lacks them, run the build-tool steps in the `archlinux:base-devel` container, which is already being pulled for you. A missing toolchain is a setup bug to fix, never a reason to skip a package.
        3. Isolate each package: one failure must not abort the others.

        EDITING — classify each package first
        4. Normal package: set `pkgver`, reset `pkgrel=1`, run `updpkgsums`, then `makepkg --printsrcinfo > .SRCINFO`.
        5. Package whose version is derived at build time by `pkgver()` — detect them with `rg -l '^\s*pkgver\s*\(\)' --glob PKGBUILD` rather than assuming a list: do NOT hand-edit the derived `pkgver`. Record the new tracked value in `old_ver.json` and leave the PKGBUILD alone unless the source clones cheaply. Some of these ship without `.SRCINFO` on purpose; do not add one from a stale value.
        6. `proton-cachyos-slr` and `wine-cachyos`: update `_srctag` only; the derived `pkgver` expression stays as-is.
        7. `chromium`: the tracked value is `{pkgver}-{commit}`. Update `pkgver` and `_commit`, ensure the literal line `_pkgver=${pkgver}` follows `pkgver=`, then refresh sums and `.SRCINFO`.
        8. Never downgrade. Confirm the direction with `vercmp` before editing. If `pkgver` is unchanged, leave the package untouched.

        FIX BEFORE YOU SKIP
        9. When `updpkgsums` or `makepkg` fails, diagnose it. Usually fixable: an illegal character in `pkgver` (keep the raw value in a `_*` variable and fold it into a makepkg-valid `pkgver`); a changed tag scheme or a moved host; a local file listed in `source` that makepkg cannot checksum (apply it from `$startdir` in `prepare()` instead). Apply the minimal fix and retry once.
        10. Skip only when no bounded fix exists. For a real skip, leave that package's `old_ver.json` entry UNCHANGED so the next run retries it, and record the package, target version, and precise reason.

        VALIDATE AND COMMIT
        11. Per changed package: `bash -n PKGBUILD` passes, `.SRCINFO` is regenerated and matches the PKGBUILD, and `tools/pkg.sh lint` / `tools/pkg.sh srcinfo` succeed where available.
        12. Stage ONLY tracked sources: `PKGBUILD`, `.SRCINFO`, patch files, and `.github/nvchecker/old_ver.json`. Delete the tarballs, debs, and `git+` clones that makepkg and updpkgsums leave behind before staging — `git status --porcelain` must show nothing unexpected.
        13. Branch `update/pkgbuilds-$(date +%Y%m%d-%H%M%S)` before the first change. One commit, push, and exactly one PR against `main`. If an open update PR already exists, push to it instead of opening a second.
        14. The PR body lists, with old -> new versions: updated, skipped (with reasons), already current. If nothing changed, do not open a PR.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
