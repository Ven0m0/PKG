name: Update Packages

permissions:
  contents: read

on:
  push:
    branches: [main]
    # vp-dev.py reads only PKGBUILD and .SRCINFO.
    paths:
      - '**/PKGBUILD'
      - '**/.SRCINFO'
      - 'tools/vp-dev.py'
      - '.github/workflows/update-packages.yml'
  # checkov:skip=CKV_GHA_7: Manual inputs required
  workflow_dispatch:

# Queue instead of cancel: each run pushes to main, and a cancelled run would
# drop that merge's packages.json update.
concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip at run time, not the triggering sha: a queued run
          # must build on the previous run's commit or its push is rejected.
          ref: ${{ github.ref }}
          show-progress: false
          persist-credentials: false
      # vp-dev.py needs only python3 and git, both on the runner image. The old
      # apt step failed on every run: namcap is not packaged for Ubuntu.
      - name: Update packages.json
        run: |
          set -euo pipefail
          chmod +x tools/vp-dev.py
          ./tools/vp-dev.py update
      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          if git diff --cached --quiet; then
            echo "packages.json is current"
            exit 0
          fi
          git commit -m "Update packages.json [automated]"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF}"
