[settings]
experimental = true
color = true
yes = true
auto_install = true

[settings.python]
uv_venv_auto = "create|source"
uv_venv_create_args = ["--seed", "--system-site-packages"]

[settings.pipx]
uvx = true

[settings.dotnet]
cli_telemetry_optout = true

[tools]
node = "24"
bun = "latest"
python = "3.15.1"
uv = "latest"
ruff = "latest"
ty = "latest"
prek = "latest"
"pipx:pytest" = "latest"
"pipx:basedpyright" = "latest"
ripgrep = "latest"
fd = "latest"
"actionlint" = "latest"
"shellcheck" = "latest"
"shfmt" = "latest"
